<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>İskonto Hesaplama Aracı | Teknobird</title>
<meta name="description" content="İndirimli fiyatı, normal fiyatı, indirim oranını ve ardışık iskontoyu saniyeler içinde hesaplayın.">
<style>
:root{--red:#e12e2e;--red-d:#b81a1f;--red-l:#fdecec;--ink:#1c1c24;--mut:#6b6f7b;--line:#e8e9ee;--bg:#f6f7fa}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;overflow-y:auto}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:transparent;color:var(--ink);padding:6px}
.tool{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);border-top:4px solid var(--red);border-radius:14px;box-shadow:0 6px 24px rgba(20,20,40,.07);overflow:hidden}
.head{padding:14px 20px 0}
.head h1{margin:0;font-size:1.2rem}
.head p{margin:2px 0 0;font-size:.82rem;color:var(--mut)}
.tabs{display:flex;gap:6px;padding:12px 20px 0}
.tab{flex:1;min-width:0;height:38px;border:1px solid #dcdee6;background:#fff;color:var(--mut);border-radius:8px;font:inherit;font-size:.82rem;font-weight:600;cursor:pointer;transition:.15s}
.tab:hover{border-color:var(--red);color:var(--red)}
.tab.on{background:var(--red);border-color:var(--red);color:#fff}
.grid{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;padding:16px 20px 10px}
.fields{display:grid;grid-template-columns:1fr;gap:0 8px;align-content:start}
.fld{margin-bottom:10px}
label{display:block;font-size:.72rem;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.in{position:relative}
input{width:100%;height:44px;padding:0 38px 0 12px;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid #dcdee6;border-radius:8px;outline:none;transition:.15s}
input:focus{border-color:var(--red);background:#fff;box-shadow:0 0 0 3px rgba(225,46,46,.15)}
.sf{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--mut);font-weight:700;pointer-events:none}
.clr{height:38px;padding:0 16px;border:1px solid #dcdee6;background:#fff;color:var(--mut);border-radius:8px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.clr:hover{color:var(--red);border-color:var(--red);background:var(--red-l)}
.out{background:linear-gradient(135deg,var(--red),var(--red-d));color:#fff;border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;min-height:270px}
.ol{font-size:.76rem;opacity:.9;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.hero{font-size:2rem;font-weight:800;margin:4px 0 10px;word-break:break-word;line-height:1.15}
.rw{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;padding:6px 0;border-top:1px solid rgba(255,255,255,.22)}
.rw b{font-weight:700}
.msg{font-size:.9rem;opacity:.95;line-height:1.4}
.bar{margin-top:auto;padding-top:12px}
.track{height:8px;background:rgba(255,255,255,.28);border-radius:99px;overflow:hidden}
.fill{height:100%;background:#fff;border-radius:99px;transition:width .25s}
.bl{display:flex;justify-content:space-between;font-size:.72rem;margin-top:5px;opacity:.92}
.foot{text-align:center;font-size:.7rem;color:var(--mut);padding:0 0 10px}
.foot a{color:var(--red);text-decoration:none;font-weight:600}
@media(max-width:600px){
  .head,.tabs{padding-left:14px;padding-right:14px}
  .tabs{flex-wrap:wrap}.tab{flex:1 1 45%}
  .grid{grid-template-columns:1fr;padding:14px 14px 8px}
  .fields{grid-template-columns:1fr 1fr}
  .fld.wide{grid-column:1/-1}
  .out{min-height:0}
  .clr{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="tool">
  <div class="head">
    <h1>İskonto Hesaplama Aracı</h1>
    <p>İndirimli fiyatı, normal fiyatı ve indirim oranını anında hesaplayın.</p>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="grid">
    <div class="fields" id="fields"></div>
    <div class="out" id="out" aria-live="polite"></div>
  </div>
  <div class="foot">Hazırlayan: <a href="https://teknobird.com" target="_blank" rel="noopener">Teknobird</a></div>
</div>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>n.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
const pc=n=>'%'+n.toLocaleString('tr-TR',{maximumFractionDigits:2});
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function num(s){s=String(s).trim();if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  return /^(\d+\.?\d*|\.\d+)$/.test(s)?parseFloat(s):NaN}
const E=m=>({err:m});

// f: [etiket, birim, örnek, isteğe bağlı mı]
const M=[
{t:'İndirimli Fiyat',f:[['Normal fiyat','₺','Örn. 2000'],['İndirim oranı','%','Örn. 25']],
 run:(p,r)=>{if(r>100)return E('İndirim oranı %100’ü geçemez.');const d=p*r/100;
  return{l:'İndirimli fiyat',h:fmt(p-d),rows:[['Normal fiyat',fmt(p)],['İndirim tutarı',fmt(d)],['İndirim oranı',pc(r)]],pct:r}}},
{t:'Normal Fiyat',f:[['İndirimli fiyat','₺','Örn. 1500'],['İndirim oranı','%','Örn. 25']],
 run:(s,r)=>{if(r>=100)return E('İndirim oranı %100’den küçük olmalı.');const n=s/(1-r/100);
  return{l:'Normal fiyat',h:fmt(n),rows:[['İndirimli fiyat',fmt(s)],['İndirim tutarı',fmt(n-s)],['İndirim oranı',pc(r)]],pct:r}}},
{t:'İndirim Oranı',f:[['Normal fiyat','₺','Örn. 2000'],['İndirimli fiyat','₺','Örn. 1500']],
 run:(p,s)=>{if(p<=0)return E('Normal fiyat sıfırdan büyük olmalı.');if(s>p)return E('İndirimli fiyat, normal fiyattan yüksek olamaz.');const r=(p-s)/p*100;
  return{l:'İndirim oranı',h:pc(r),rows:[['Normal fiyat',fmt(p)],['İndirimli fiyat',fmt(s)],['İndirim tutarı',fmt(p-s)]],pct:r}}},
{t:'Ardışık İskonto',f:[['Liste fiyatı','₺','Örn. 1000'],['1. iskonto','%','Örn. 20'],['2. iskonto','%','Örn. 10',1],['3. iskonto','%','Örn. 5',1]],
 run:(p,a,b,c)=>{if(Math.max(a,b,c)>100)return E('İskonto oranı %100’ü geçemez.');if(p<=0)return E('Liste fiyatı sıfırdan büyük olmalı.');
  const n=p*(1-a/100)*(1-b/100)*(1-c/100),e=(1-n/p)*100;
  return{l:'Net fiyat',h:fmt(n),rows:[['Liste fiyatı',fmt(p)],['Toplam indirim',fmt(p-n)],['Efektif iskonto',pc(e)],['Basit toplam (yanıltıcı)',pc(a+b+c)]],pct:e}}}
];
let cur=0;const vals=M.map(m=>m.f.map(()=>''));

function renderTabs(){$('tabs').innerHTML=M.map((m,i)=>`<button type="button" class="tab${i===cur?' on':''}" data-t="${i}">${m.t}</button>`).join('')}
function renderFields(){
  const f=M[cur].f;
  $('fields').innerHTML=f.map((x,i)=>`<div class="fld${f.length===4&&i===0?' wide':''}"><label for="f${i}">${x[0]}${x[3]?' (isteğe bağlı)':''}</label><div class="in"><input id="f${i}" data-i="${i}" inputmode="decimal" autocomplete="off" placeholder="${x[2]}" value="${esc(vals[cur][i])}"><span class="sf">${x[1]}</span></div></div>`).join('')+'<button type="button" class="clr" id="clr">Temizle</button>';
  calc();
}
function calc(){
  const m=M[cur],n=m.f.map((x,i)=>num(vals[cur][i]));
  let wait=false;n.forEach((v,i)=>{if(isNaN(v)){if(m.f[i][3])n[i]=0;else wait=true}});
  let h;
  if(wait){h=`<div class="ol">Sonuç</div><div class="hero">—</div><div class="msg">Değerleri girdiğinizde sonuç burada anında görünür.</div>`}
  else{const r=m.run(...n);
    if(r.err)h=`<div class="ol">Dikkat</div><div class="hero">—</div><div class="msg">${r.err}</div>`;
    else{const p=Math.min(100,Math.max(0,r.pct));
      h=`<div class="ol">${r.l}</div><div class="hero">${r.h}</div>${r.rows.map(x=>`<div class="rw"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}
      <div class="bar"><div class="track"><div class="fill" style="width:${100-p}%"></div></div><div class="bl"><span>Ödenen ${pc(100-p)}</span><span>İndirim ${pc(p)}</span></div></div>`}}
  $('out').innerHTML=h;
}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b){cur=+b.dataset.t;renderTabs();renderFields()}});
$('fields').addEventListener('input',e=>{const t=e.target;if(t.dataset.i!==undefined){vals[cur][t.dataset.i]=t.value;calc()}});
$('fields').addEventListener('click',e=>{if(e.target.id==='clr'){vals[cur]=M[cur].f.map(()=>'');renderFields()}});
renderTabs();renderFields();
</script>
</body>
</html>
